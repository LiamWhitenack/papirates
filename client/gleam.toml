# client/gleam.toml


[dependencies]
shared = { path = "../shared" }
gleam_stdlib = ">= 1.0.0 and < 2.0.0"
lustre = ">= 5.7.1 and < 6.0.0"
gleam_http = ">= 4.4.0 and < 5.0.0"
gleam_fetch = ">= 1.4.1 and < 2.0.0"
gleam_javascript = ">= 1.0.1 and < 2.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"

[tools.lustre.html]
title = "Papirates"

[dev_dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
lustre_dev_tools = ">= 2.3.6 and < 3.0.0"

[tools.lustre.dev]
proxy = { from = "/api", to = "http://localhost:8000/api" }
